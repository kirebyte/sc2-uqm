[package]
name = "uqm-rust"
version = "0.1.0"
edition = "2024"
authors = ["Kira <kirebyte@foxybyte.dev>"]
description = "Modern Rust reimplementation of The Ur-Quan Masters (Star Control 2)"
license = "GPL-2.0"
repository = "https://github.com/kirebyte/sc2-uqm"
keywords = ["game", "space", "adventure", "classic"]
categories = ["games"]

[lib]
name = "uqm"
path = "src/lib.rs"

[[bin]]
name = "uqm-game"
path = "src/main.rs"

[dependencies]
# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Math & Physics
nalgebra = "0.33"
glam = "0.29"

# Random Number Generation
rand = "0.8"
rand_chacha = "0.3"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# The following dependencies will be added in their respective phases:
# Phase 2: bevy, wgpu, winit (graphics)
# Phase 4: rodio (audio)
# Phase 7: noise (terrain), image (sprites)
# Phase 8: walkdir (asset management)

[dev-dependencies]
# Testing
proptest = "1.5" # Property-based testing
rstest = "0.22" # Fixture-based testing

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Testing utilities
approx = "0.5" # Float comparison in tests

[features]
default = []

[profile.dev]
opt-level = 1 # Slightly optimize debug builds for better performance

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[[bench]]
name = "melee_benchmark"
harness = false

[[bench]]
name = "starmap_benchmark"
harness = false

[[bench]]
name = "rendering_benchmark"
harness = false
